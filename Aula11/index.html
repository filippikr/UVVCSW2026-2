<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="justify">
        <div class="container0">
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
        </div>

        <div class="container1">
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
        </div>

        <div class="container2">
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
        </div>

        <div class="container3">
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
        </div>

        <div class="container4">
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
        </div>

    </div>

    <div class="align">
        <div class="container5">
            <div class="itemAlign1"></div>
            <div class="itemAlign2"></div>
            <div class="itemAlign3"></div>
        </div>

        <div class="container6">
            <div class="itemAlign1"></div>
            <div class="itemAlign2"></div>
            <div class="itemAlign3"></div>
        </div>

        <div class="container7">
            <div class="itemAlign1">.</div>
            <div class="itemAlign2">.</div>
            <div class="itemAlign3">.</div>
        </div>

        <div class="container8">
            <div class="itemAlign1"></div>
            <div class="itemAlign2"></div>
            <div class="itemAlign3"></div>
        </div>

    </div>
</body>
</html>
